<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Mercado</title>
</head>
<body>

    <h1>Pesquisa de Hobbies e Preferências</h1>

    <form action="/enviar-pesquisa" method="post">
        
        <div>
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        <br>
        
        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <br>

        <div>
            <p><strong>Nível de experiência em programação:</strong></p>
            <input type="radio" id="iniciante" name="experiencia_prog" value="iniciante">
            <label for="iniciante">Iniciante</label><br>

            <input type="radio" id="intermediario" name="experiencia_prog" value="intermediario">
            <label for="intermediario">Intermediário</label><br>

            <input type="radio" id="avancado" name="experiencia_prog" value="avancado">
            <label for="avancado">Avançado</label>
        </div>
        <br>

        <div>
            <p><strong>Selecione seus hobbies:</strong></p>
            <input type="checkbox" id="leitura" name="hobbies[]" value="leitura">
            <label for="leitura">Leitura</label><br>

            <input type="checkbox" id="esportes" name="hobbies[]" value="esportes">
            <label for="esportes">Esportes</label><br>

            <input type="checkbox" id="musica" name="hobbies[]" value="musica">
            <label for="musica">Música</label><br>
            
            <input type="checkbox" id="jogos" name="hobbies[]" value="jogos">
            <label for="jogos">Jogos</label>
        </div>
        <br>

        <div>
            <label for="comentario">Comentários Adicionais:</label>
            <br>
            <textarea id="comentario" name="comentario" rows="4" cols="50"></textarea>
        </div>
        <br>

        <button type="submit">Enviar Pesquisa</button>

    </form>

</body>
</html>
