<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>
    <form action="resposta" method="post">
        <fieldset>
            <label for="Nome">Nome: </label>
            <input type="text" name="Nome" placeholder="Digite seu nome">
        </fieldset>
        <fieldset>
            <label for="Profissao">Profissao: </label>
            <input type="text" name="Profissao" placeholder="Digite sua Profissão">
        </fieldset>
        <fieldset>
            <label for="">Cor:</label>
            <input type="color">
        </fieldset>

        <fieldset>
            <label> Termo de Consentimento </label>
            <input type="checkbox">
        </fieldset>

        <fieldset>
            <input type="radio"> Masculino
            <input type="radio"> Feminino
            <input type="radio"> Outro
        </fieldset>
            
        <fieldset>
            <textarea cols="40" rows="5" maxlength="10"></textarea>
        </fieldset>

        <fieldset>
            <select>
                <option value="">Mago</option>
                <option value="">Guerreiro</option>
                <option value="">Ladino</option>
                <option value="">Druida</option>
            </select>
        </fieldset>

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>


    </form>
</body>

</html>
